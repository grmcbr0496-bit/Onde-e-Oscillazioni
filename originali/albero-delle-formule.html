<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'albero delle formule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;family=Kalam:wght@400;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
/* Quaderno a quadretti: inchiostro blu, evidenziatori come negli appunti, una corda vibrante che risponde alle risposte. */
:root {
  --paper: #f3f5f8;
  --paper-glass: rgba(243, 245, 248, 0.9);
  --grid: rgba(52, 92, 160, 0.09);
  --card: #ffffff;
  --ink: #1b2742;
  --ink-2: #56627a;
  --line: #d3d9e4;
  --pen: #2747c9;
  --pen-ink: #ffffff;
  --good: #16824a;
  --good-bg: #e3f5ea;
  --bad: #c42f3e;
  --bad-bg: #fbe6e8;
  --hl-1: rgba(255, 226, 77, 0.78);
  --hl-2: rgba(255, 136, 180, 0.6);
  --hl-3: rgba(124, 222, 140, 0.66);
  --hl-4: rgba(122, 196, 255, 0.66);
  --hl-5: rgba(255, 172, 92, 0.66);
  --lv0: #e8a3aa;
  --lv1: #f2b36b;
  --lv2: #f1d34f;
  --lv3: #a6dc78;
  --lv4: #5fc27c;
  --lv5: #16824a;
  --shadow: #1b2742;
  --font-display: "Kalam", "Segoe Print", "Bradley Hand", cursive;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f141e;
    --paper-glass: rgba(15, 20, 30, 0.9);
    --grid: rgba(140, 170, 235, 0.07);
    --card: #171e2b;
    --ink: #e6ebf5;
    --ink-2: #9aa6bd;
    --line: #2a3448;
    --pen: #8ea6ff;
    --pen-ink: #0d1322;
    --good: #5fd08d;
    --good-bg: rgba(95, 208, 141, 0.14);
    --bad: #ff7d8a;
    --bad-bg: rgba(255, 125, 138, 0.14);
    --hl-1: rgba(255, 226, 77, 0.36);
    --hl-2: rgba(255, 136, 180, 0.3);
    --hl-3: rgba(124, 222, 140, 0.28);
    --hl-4: rgba(122, 196, 255, 0.3);
    --hl-5: rgba(255, 172, 92, 0.3);
    --lv0: #8f4a52;
    --lv1: #b9783b;
    --lv2: #c3a83a;
    --lv3: #7fae58;
    --lv4: #4fae6d;
    --lv5: #5fd08d;
    --shadow: #000000;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f141e;
  --paper-glass: rgba(15, 20, 30, 0.9);
  --grid: rgba(140, 170, 235, 0.07);
  --card: #171e2b;
  --ink: #e6ebf5;
  --ink-2: #9aa6bd;
  --line: #2a3448;
  --pen: #8ea6ff;
  --pen-ink: #0d1322;
  --good: #5fd08d;
  --good-bg: rgba(95, 208, 141, 0.14);
  --bad: #ff7d8a;
  --bad-bg: rgba(255, 125, 138, 0.14);
  --hl-1: rgba(255, 226, 77, 0.36);
  --hl-2: rgba(255, 136, 180, 0.3);
  --hl-3: rgba(124, 222, 140, 0.28);
  --hl-4: rgba(122, 196, 255, 0.3);
  --hl-5: rgba(255, 172, 92, 0.3);
  --lv0: #8f4a52;
  --lv1: #b9783b;
  --lv2: #c3a83a;
  --lv3: #7fae58;
  --lv4: #4fae6d;
  --lv5: #5fd08d;
  --shadow: #000000;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.45;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; border-radius: 10px; }

.wrap { max-width: 620px; margin: 0 auto; padding: 0 16px 56px; }

/* barra in alto */
.top {
  position: sticky; top: 0; z-index: 10;
  background: var(--paper-glass);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.top-in { max-width: 620px; margin: 0 auto; padding: 10px 16px 8px; display: flex; align-items: center; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; line-height: 1; flex: 1; white-space: nowrap; }
.lvl { font-size: 0.82rem; color: var(--ink-2); text-align: right; line-height: 1.2; }
.lvl b { color: var(--ink); font-weight: 700; }
.streak { font-family: var(--font-mono); font-size: 0.8rem; font-weight: 600; border: 1.5px solid var(--ink); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.xpbar { height: 4px; background: var(--line); }
.xpbar i { display: block; height: 100%; background: var(--pen); width: 0; transition: width .4s ease; }

h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 2.3rem; line-height: 1.05; letter-spacing: -0.01em; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; line-height: 1.15; }
.eyebrow { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.muted { color: var(--ink-2); }
.mark { background: linear-gradient(transparent 52%, var(--hl-1) 52%, var(--hl-1) 90%, transparent 90%); padding: 0 .12em; }

section { margin-top: 30px; display: grid; gap: 14px; }
.hero { margin-top: 22px; }

/* corda */
.wavebox { position: relative; }
.wavebox canvas { display: block; width: 100%; height: 96px; }
.wavebox.small canvas { height: 62px; }
.wave-cap { font-family: var(--font-mono); font-size: 0.74rem; color: var(--ink-2); text-align: right; margin-top: -2px; }

/* pulsanti */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 50px; padding: 12px 18px;
  border: 2px solid var(--ink); border-radius: 14px;
  background: var(--card); color: var(--ink);
  font-weight: 700; cursor: pointer;
  box-shadow: 3px 3px 0 var(--shadow);
  transition: transform .08s ease, box-shadow .08s ease;
  text-align: center;
}
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }
.btn.primary { background: var(--pen); color: var(--pen-ink); }
.btn.big { min-height: 58px; font-size: 1.1rem; width: 100%; }
.btn.full { width: 100%; }
.btn[disabled] { opacity: .5; cursor: default; }
.link { background: none; border: 0; padding: 6px 2px; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

.today { display: grid; gap: 10px; }
.today-num { font-size: 1.05rem; }
.today-num b { font-family: var(--font-mono); font-size: 1.2rem; }
.lampo-btn { justify-content: space-between; width: 100%; }
.lampo-btn .lb { display: grid; text-align: left; gap: 2px; }
.lampo-btn .lb span { font-weight: 400; font-size: .88rem; color: var(--ink-2); }
.lampo-btn .rec { font-family: var(--font-mono); font-size: .82rem; font-weight: 600; color: var(--ink-2); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  min-width: 40px; min-height: 36px; padding: 4px 10px;
  border: 1.5px solid var(--line); border-radius: 999px; background: var(--card);
  font-family: var(--font-mono); font-size: .85rem; font-weight: 600; cursor: pointer;
}
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--hl-1); }
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mode {
  display: grid; gap: 4px; align-content: start; text-align: left;
  padding: 12px; border: 2px solid var(--ink); border-radius: 14px; background: var(--card);
  box-shadow: 3px 3px 0 var(--shadow); cursor: pointer; min-height: 92px;
}
.mode:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }
.mode b { font-size: 1rem; }
.mode span { font-size: .82rem; color: var(--ink-2); line-height: 1.3; }
@media (max-width: 420px) { .modes { grid-template-columns: 1fr; } .mode { min-height: 0; } }

/* albero */
.tree { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.branch {
  width: 100%; display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px;
  padding: 10px 12px; text-align: left; cursor: pointer;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 14px;
}
.branch:hover { border-color: var(--ink-2); }
.cn { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; text-align: center; line-height: 1; padding: 6px 0 4px; border-radius: 6px; }
.h1c { background: var(--hl-1); } .h2c { background: var(--hl-2); } .h3c { background: var(--hl-3); } .h4c { background: var(--hl-4); } .h5c { background: var(--hl-5); }
.cname { display: grid; gap: 6px; font-weight: 700; }
.pct { font-family: var(--font-mono); font-weight: 600; font-size: .9rem; font-variant-numeric: tabular-nums; }
.pips { display: flex; flex-wrap: wrap; gap: 3px; }
.pip { width: 10px; height: 10px; border-radius: 3px; border: 1.5px solid var(--line); }
.pip.b0 { background: var(--lv0); border-color: var(--lv0); }
.pip.b1 { background: var(--lv1); border-color: var(--lv1); }
.pip.b2 { background: var(--lv2); border-color: var(--lv2); }
.pip.b3 { background: var(--lv3); border-color: var(--lv3); }
.pip.b4 { background: var(--lv4); border-color: var(--lv4); }
.pip.b5 { background: var(--lv5); border-color: var(--lv5); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .78rem; color: var(--ink-2); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }

.how p { margin: 0; color: var(--ink-2); max-width: 62ch; }
.foot { margin-top: 34px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: .82rem; color: var(--ink-2); }

/* domanda */
.sesbar { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.sesbar .link { padding: 8px 0; }
.prog { flex: 1; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--pen); transition: width .3s ease; }
.count { font-family: var(--font-mono); font-size: .85rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.q { display: grid; gap: 14px; margin-top: 8px; }
.qhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; justify-content: space-between; }
.tag { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; line-height: 1.1; padding: 2px 6px 0; border-radius: 4px; }
.qch { font-size: .8rem; color: var(--ink-2); }
.prompt { margin: 0; font-size: 1.12rem; font-weight: 700; line-height: 1.35; }
.panel { background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.math { overflow-x: auto; overflow-y: hidden; max-width: 100%; padding: 4px 2px; }
.math .katex-display { margin: .3em 0; }
.math.raw { font-family: var(--font-mono); font-size: .8rem; white-space: pre-wrap; word-break: break-all; }
.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 26px 1fr; align-items: center; gap: 8px;
  width: 100%; min-height: 58px; padding: 8px 10px; text-align: left;
  border: 2px solid var(--line); border-radius: 14px; background: var(--card); cursor: pointer;
}
.opt:hover:not([disabled]) { border-color: var(--ink-2); }
.opt .k { font-family: var(--font-mono); font-size: .78rem; font-weight: 600; color: var(--ink-2); border: 1.5px solid var(--line); border-radius: 6px; text-align: center; line-height: 22px; }
.opt .math { padding: 2px 0; }
.opt[disabled] { cursor: default; }
.opt.ok { border-color: var(--good); background: var(--good-bg); }
.opt.no { border-color: var(--bad); background: var(--bad-bg); }
.opt.dim { opacity: .55; }
.feedback { display: grid; gap: 10px; border-left: 5px solid var(--line); padding: 4px 0 4px 12px; }
.feedback.ok { border-color: var(--good); }
.feedback.no { border-color: var(--bad); }
.verdict { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; line-height: 1.1; }
.feedback.ok .verdict { color: var(--good); }
.feedback.no .verdict { color: var(--bad); }
.note { margin: 0; font-size: .95rem; color: var(--ink-2); }
.grades { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grades .btn { padding: 10px 8px; min-height: 52px; font-size: .95rem; }
.btn.g-no { border-color: var(--bad); color: var(--bad); }
.btn.g-ok { background: var(--good); color: var(--pen-ink); }
.hint { margin: 0; color: var(--ink-2); font-size: .95rem; }

/* risultati */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 2px; }
.tile b { font-family: var(--font-mono); font-size: 1.45rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile span { font-size: .8rem; color: var(--ink-2); }
.review-list { display: grid; gap: 10px; }
.rv { display: grid; gap: 4px; }
.rv h3 { font-size: 1rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.row .btn { flex: 1 1 200px; }
.levelup { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; padding: 8px 12px; border-radius: 10px; background: var(--hl-3); }

/* capitolo */
.chhead { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.chhead .cn { font-size: 2.4rem; padding: 10px 12px 6px; }
.fl { display: grid; gap: 10px; }
.fcard { display: grid; gap: 6px; }
.fcard-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.fcard-top h3 { font-size: 1rem; }
.lvpips { display: flex; gap: 3px; flex: none; }
.lvpips i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line); }
.lvpips i.on { background: var(--pen); border-color: var(--pen); }

/* lampo */
.timer { flex: 1; height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.timer i { display: block; height: 100%; background: var(--hl-5); border-right: 2px solid var(--ink); }
.score { font-family: var(--font-mono); font-weight: 600; font-size: 1.1rem; font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; }
.swipe {
  touch-action: pan-y; user-select: none; -webkit-user-select: none;
  background: var(--card); border: 2px solid var(--ink); border-radius: 18px; padding: 14px 12px;
  box-shadow: 4px 4px 0 var(--shadow); display: grid; gap: 8px; min-height: 170px; align-content: center;
  transition: border-color .15s ease;
}
.swipe.ok { border-color: var(--good); }
.swipe.no { border-color: var(--bad); }
.swipe .qch { text-align: center; font-size: .9rem; font-weight: 700; color: var(--ink); }
.vf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.vf .btn { min-height: 60px; font-size: 1.05rem; }
.btn.v-no { color: var(--bad); border-color: var(--bad); }
.btn.v-yes { color: var(--good); border-color: var(--good); }
.toast { min-height: 90px; display: grid; gap: 4px; align-content: start; font-size: .9rem; }
.toast .t-head { font-weight: 700; color: var(--bad); }
.combo { font-family: var(--font-mono); font-size: .82rem; font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main class="wrap" id="app" aria-live="polite"></main>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script>
"use strict";
const DATA = {
 "chapters": [
  "Oscillatore armonico",
  "Oscillatore smorzato",
  "Oscillatore forzato",
  "Più gradi di libertà",
  "Corda e D'Alembert",
  "Riflessione e trasmissione",
  "Onde acustiche",
  "Onde in 3D",
  "Doppler e Mach",
  "Interferenza",
  "Diffrazione e reticoli",
  "Ottica geometrica"
 ],
 "cards": [
  {
   "c": 1,
   "n": "Equazione del moto",
   "q": "Equazione del moto dell'oscillatore armonico, scritta con ω₀",
   "t": "\\ddot{x} + @@ = 0,\\qquad \\omega_0^2 = \\frac{\\alpha}{m}",
   "a": "\\omega_0^2\\,x",
   "d": [
    "\\omega_0\\,x",
    "\\omega_0^2\\,\\dot{x}",
    "\\frac{m}{\\alpha}\\,x"
   ],
   "h": "Forza di richiamo F = −αx. Per piccole oscillazioni attorno a un minimo del potenziale α = U″(x₀).",
   "id": "1.1"
  },
  {
   "c": 1,
   "n": "Pulsazione propria",
   "q": "Pulsazione propria ω₀ per una forza di richiamo F = −αx",
   "t": "\\omega_0 = @@",
   "a": "\\sqrt{\\frac{\\alpha}{m}}",
   "d": [
    "\\sqrt{\\frac{m}{\\alpha}}",
    "\\frac{\\alpha}{m}",
    "2\\pi\\sqrt{\\frac{\\alpha}{m}}"
   ],
   "h": "α = U″(x₀), la curvatura del potenziale nel minimo. Molla: α = k; pendolo: α = mg/l.",
   "id": "1.2"
  },
  {
   "c": 1,
   "n": "Soluzione generale",
   "q": "Soluzione generale dell'oscillatore armonico, nelle due forme",
   "t": "x(t) = A\\cos(\\omega_0 t) + B\\sin(\\omega_0 t) = @@",
   "a": "C\\cos(\\omega_0 t + \\varphi)",
   "d": [
    "C\\cos(\\omega_0 t) + \\varphi",
    "C\\,e^{-\\omega_0 t}\\cos\\varphi",
    "C\\cos(\\omega_0 t)\\sin\\varphi"
   ],
   "h": "Due costanti arbitrarie, fissate dalle due condizioni iniziali.",
   "id": "1.3"
  },
  {
   "c": 1,
   "n": "Periodo e frequenza",
   "q": "Relazioni tra periodo T, frequenza ν e pulsazione ω₀",
   "t": "T = @@,\\qquad \\nu = \\frac{1}{T},\\qquad \\omega_0 = 2\\pi\\nu",
   "a": "\\frac{2\\pi}{\\omega_0}",
   "d": [
    "\\frac{1}{\\omega_0}",
    "2\\pi\\,\\omega_0",
    "\\frac{\\omega_0}{2\\pi}"
   ],
   "h": "ω₀ in rad/s, ν in Hz. Errore classico: T = 1/ω₀.",
   "id": "1.4"
  },
  {
   "c": 1,
   "n": "Massa–molla",
   "q": "Pulsazione e periodo del sistema massa–molla",
   "t": "\\omega_0 = \\sqrt{\\frac{k}{m}},\\qquad T = @@",
   "a": "2\\pi\\sqrt{\\frac{m}{k}}",
   "d": [
    "2\\pi\\sqrt{\\frac{k}{m}}",
    "\\sqrt{\\frac{m}{k}}",
    "\\frac{1}{2\\pi}\\sqrt{\\frac{k}{m}}"
   ],
   "h": "Caso α = k. Controllo: √(kg/(N/m)) = s.",
   "id": "1.5"
  },
  {
   "c": 1,
   "n": "Pendolo semplice",
   "q": "Pendolo semplice per piccoli angoli: equazione e periodo",
   "t": "\\ddot{\\vartheta} + \\frac{g}{l}\\,\\vartheta = 0,\\qquad T = @@",
   "a": "2\\pi\\sqrt{\\frac{l}{g}}",
   "d": [
    "2\\pi\\sqrt{\\frac{g}{l}}",
    "2\\pi\\sqrt{\\frac{l}{mg}}",
    "\\sqrt{\\frac{l}{g}}"
   ],
   "h": "Solo per θ ≪ 1 (sin θ ≈ θ). Non dipende da massa e ampiezza: isocronismo.",
   "id": "1.6"
  },
  {
   "c": 1,
   "n": "Pendolo dal potenziale",
   "q": "Potenziale del pendolo sviluppato per x ≪ l, con la prima correzione",
   "t": "U(x) = mgl\\left[1-\\sqrt{1-\\frac{x^2}{l^2}}\\right] \\simeq @@",
   "a": "\\frac{mg}{2l}\\,x^2 + \\frac{mg}{8l^3}\\,x^4",
   "d": [
    "\\frac{mg}{l}\\,x^2 + \\frac{mg}{2l^3}\\,x^4",
    "\\frac{mgl}{2}\\,x^2 + \\frac{mgl}{8}\\,x^4",
    "\\frac{mg}{2l}\\,x^2 - \\frac{mg}{8l^3}\\,x^4"
   ],
   "h": "Il termine in x² dà α = mg/l. Viene da √(1−u) ≈ 1 − u/2 − u²/8.",
   "id": "1.7"
  },
  {

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function blank() { return { v: 1, updatedAt: 0, xp: 0, streak: { n: 0, last: "" }, best: { lampo: 0 }, cards: {} }; }
function loadState() {

  return blank();
}

const isSeen = id => !!(S.cards[id] && S.cards[id].seen);

function touchStreak() {
  const t = today();
  if (S.streak.last === t) return;
  S.streak.n = S.streak.last === today(-DAY) ? S.streak.n + 1 : 1;
  S.streak.last = t;
}
/* kind: rec (riconoscere), mem (a memoria), lampo, study. res: ok | quasi | no */
function grade(id, kind, res) {
  const x = Object.assign({ b: 0, due: 0, s: 0, r: 0, w: 0, seen: 0 }, S.cards[id]);
  const now = Date.now();
  x.seen = 1;
  if (kind === "study") { x.due = now; }
  else if (kind === "lampo") {
    if (res === "no") { x.b = Math.max(0, x.b - 1); x.due = now; x.w++; } else { x.r++; }
    x.s++;
  } else {
    x.s++;
    if (res === "ok") {
      x.r++;
      if (kind === "mem") x.b = Math.min(5, x.b + 1);
      else if (x.b < 3) x.b = x.b + 1;
      x.due = now + IV[x.b];
    } else if (res === "quasi") {
      x.b = Math.max(1, Math.min(x.b, 2)); x.due = now + IV[1];
    } else {
      x.w++; x.b = 0; x.due = now;
    }
  }
  S.cards[id] = x;
  touchStreak();
}
function mastery(list) {
  list = list || CARDS;
  let sum = 0; for (const c of list) sum += cs(c.id).b;

const Sync = {
  ref: null, busy: false, dirty: false, timer: 0, cloud: false,
  async init() {
    try {
      const cl = window.claude;
      if (!cl || typeof cl.use !== "function") return;
      const [db, user] = await Promise.all([cl.use("db"), cl.use("user")]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const ref = db.doc("data/users/" + id + "/progress");
      const snap = await Promise.race([ref.get(), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 10000))]);
      this.ref = ref;
      const remote = snap && snap.exists ? snap.data() : null;
      const rs = remote && remote.state;
      if (rs && rs.v === 1 && (rs.updatedAt || 0) > (S.updatedAt || 0)) {
        S = Object.assign(blank(), JSON.parse(JSON.stringify(rs)));
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
        if (VIEW.name === "home" || VIEW.name === "chapter") render();
        renderTop();
      } else if (S.updatedAt > 0 && (!rs || (rs.updatedAt || 0) < S.updatedAt)) {
        this.schedule(0);
      }
      this.cloud = true;
      const el = document.getElementById("syncnote"); if (el) el.textContent = syncText();
    } catch (e) { this.ref = null; }
  },
  schedule(delay = 1500) {
    if (!this.ref) return;
    this.dirty = true; clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), delay);
  },
  async flush() {
    if (!this.ref || this.busy || !this.dirty) return;
    this.busy = true; this.dirty = false;
    try { await this.ref.set({ state: JSON.parse(JSON.stringify(S)) }); }
    catch (e) {
      const code = e && e.code;
      if (code === "unavailable" || code === "resource_exhausted") { this.dirty = true; setTimeout(() => this.flush(), 2500 + Math.random() * 2500); }
      else { this.ref = null; this.cloud = false; }
    }
    this.busy = false;
    if (this.dirty && this.ref) this.schedule();
  }
};

function renderTex(el) {
  const src = el.getAttribute("data-tex");
  const display = el.getAttribute("data-inline") === null;
  if (window.katex) {
    try { window.katex.render(display ? src : "\\displaystyle " + src, el, { displayMode: display, throwOnError: false, strict: "ignore" }); }
    catch (e) { el.textContent = src; el.classList.add("raw"); }
  } else { el.textContent = src; el.classList.add("raw"); }
}
function fit(el) {
  el.style.fontSize = "";
  let f = 1;
  while (el.scrollWidth > el.clientWidth + 1 && f > 0.5) { f -= 0.05; el.style.fontSize = f + "em"; }
}
function mathAll(root) {
  const els = root.querySelectorAll("[data-tex]");
  els.forEach(renderTex);
  requestAnimationFrame(() => els.forEach(fit));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => els.forEach(el => el.isConnected && fit(el)));
}

/* ---------- la corda (combo = modo normale) ---------- */
const Wave = {
  cv: null, ctx: null, A: 0.3, target: 0.3, n: 1, t: 0, flash: 0, tone: "good", raf: 0, colors: null,
  still: window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches,
  attach(cv) {
    this.cv = cv; if (!cv) return;
    this.ctx = cv.getContext("2d");
    this.readColors(); this.resize();
    if (this.still) this.draw();
    else if (!this.raf) this.loop();
  },
  readColors() {
    const cs = getComputedStyle(document.documentElement);
    const g = n => cs.getPropertyValue(n).trim();
    this.colors = { ink: g("--ink"), hl: g("--hl-4"), good: g("--good"), bad: g("--bad"), line: g("--ink-2") };
  },
  resize() {
    if (!this.cv) return;
    const r = this.cv.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    this.cv.width = Math.max(1, Math.round(r.width * dpr));
    this.cv.height = Math.max(1, Math.round(r.height * dpr));
    this.dpr = dpr;
  },
  set(a, n) { this.target = a; this.n = n; if (this.still) this.draw(); },
  kick(combo) {
    this.n = combo >= 9 ? 5 : combo >= 6 ? 4 : combo >= 4 ? 3 : combo >= 2 ? 2 : 1;
    this.A = Math.min(1, this.A + 0.28 + 0.04 * combo); this.flash = 1; this.tone = "good";
    if (this.still) this.draw();
  },
  damp() { this.A *= 0.25; this.n = 1; this.flash = 1; this.tone = "bad"; if (this.still) this.draw(); },
  loop() {
    const step = () => {
      this.t += 1 / 60;
      this.A += (this.target - this.A) * 0.012;
      this.flash = Math.max(0, this.flash - 0.025);
      this.draw();
      this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  },
  draw() {
    const cv = this.cv, ctx = this.ctx;
    if (!cv || !ctx || !cv.isConnected) return;
    const w = cv.width, h = cv.height, d = this.dpr || 1, C = this.colors;
    ctx.clearRect(0, 0, w, h);
    const pad = 12 * d, x0 = pad, x1 = w - pad, mid = h / 2;
    const amp = (h / 2 - 8 * d) * this.A;
    const om = 2 * Math.PI * (0.55 + 0.22 * this.n);
    const ph = this.still ? 1 : Math.cos(om * this.t);
    const pts = [];
    for (let i = 0; i <= 160; i++) {
      const u = i / 160;
      pts.push([x0 + u * (x1 - x0), mid - amp * Math.sin(this.n * Math.PI * u) * ph]);
    }
    const path = () => { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); };
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    path(); ctx.strokeStyle = C.hl; ctx.lineWidth = 11 * d; ctx.stroke();
    if (this.flash > 0) { ctx.globalAlpha = this.flash * 0.8; path(); ctx.strokeStyle = this.tone === "good" ? C.good : C.bad; ctx.lineWidth = 6 * d; ctx.stroke(); ctx.globalAlpha = 1; }
    path(); ctx.strokeStyle = C.ink; ctx.lineWidth = 2.2 * d; ctx.stroke();
    ctx.fillStyle = C.ink;
    for (let k = 0; k <= this.n; k++) {
      const x = x0 + (k / this.n) * (x1 - x0);
      ctx.beginPath(); ctx.arc(x, mid, (k === 0 || k === this.n ? 4.5 : 2.6) * d, 0, 2 * Math.PI); ctx.fill();
    }
  }
};
window.addEventListener("resize", () => { Wave.resize(); if (Wave.still) Wave.draw(); });

}

let SES = null;
function modeFor(id) {
  const b = cs(id).b;
  if (!isSeen(id)) return "study";
  if (b === 0) return "cloze";
  if (b === 1) return "quale";
  if (b === 2) return Math.random() < 0.5 ? "cloze" : "memoria";
  return "memoria";
}
function withChecks(base, fresh) {
  // nuove formule: prima le leggi, poi almeno due domande dopo te le chiedo da completare
  const main = [], due = shuffle(base);
  let di = 0;
  for (const c of fresh) { main.push({ id: c.id, mode: "study" }); if (di < due.length) main.push(due[di++]); }
  while (di < due.length) main.push(due[di++]);
  const out = [], pending = [];
  for (const it of main) {
    while (pending.length && pending[0].at <= out.length) out.push(pending.shift().item);
    out.push(it);
    if (it.mode === "study") pending.push({ at: out.length + 2, item: { id: it.id, mode: "cloze" } });
  }
  for (const p of pending) out.push(p.item);
  return out;
}
function startSession(items, title, again) {
  if (!items.length) return;
  SES = { items, i: 0, ok: 0, tot: 0, combo: 0, maxCombo: 0, xp: 0, wrong: [], requeued: new Set(), title, again, startLevel: level(), state: "ask" };
  Wave.A = 0.15; Wave.n = 1;
  go("session");
}
function startReview() {
  const p = reviewPlan();
  if (!p.dueTake.length && !p.freshTake.length) return startWeakest();
  const base = p.dueTake.map(c => ({ id: c.id, mode: modeFor(c.id) }));
  startSession(withChecks(base, p.freshTake), "Ripasso di oggi", startReview);
}
function startWeakest() {
  const pool = shuffle(CARDS).sort((a, b) => cs(a.id).b - cs(b.id).b || cs(a.id).due - cs(b.id).due).slice(0, 10);
  const seen = pool.filter(c => isSeen(c.id)).map(c => ({ id: c.id, mode: modeFor(c.id) }));
  startSession(withChecks(seen, pool.filter(c => !isSeen(c.id))), "Le più deboli", startWeakest);
}
function startFree(mode) {
  const f = VIEW.filter;
  const pool = CARDS.filter(c => !f || c.c === f);
  const pickd = shuffle(pool).sort((a, b) => cs(a.id).b - cs(b.id).b).slice(0, 10);
  startSession(shuffle(pickd).map(c => ({ id: c.id, mode })), "Allenamento", () => startFree(mode));
}
function startChapter(ch) {
  const list = CARDS.filter(c => c.c === ch);
  const seen = list.filter(c => isSeen(c.id)).map(c => ({ id: c.id, mode: modeFor(c.id) }));
  startSession(withChecks(seen, list.filter(c => !isSeen(c.id))), CH[ch - 1], () => startChapter(ch));
}

const MODE_LABEL = { study: "Nuova formula", cloze: "Completa la formula", quale: "Quale formula è giusta?", memoria: "A memoria" };
const MODE_HL = { study: "h4c", cloze: "h1c", quale: "h2c", memoria: "h3c" };

function buildOptions(it) {
  const c = BY_ID[it.id];
  if (it.mode === "cloze") {
    return shuffle([{ tex: c.a, ok: true }].concat(c.d.map(t => ({ tex: t, ok: false }))));
  }
  // "Quale formula?": la formula giusta e i tre distrattori della STESSA scheda, scritti per intero.
  // Niente formule di altre schede: sarebbero riconoscibili subito dal membro a sinistra.
  return shuffle([{ tex: full(c), ok: true }].concat(c.d.map(t => ({ tex: fill(c, t), ok: false }))));
}

function renderQuestion() {
  const it = SES.items[SES.i], c = BY_ID[it.id];
  if (!it.opts && (it.mode === "cloze" || it.mode === "quale")) it.opts = buildOptions(it);
  const pct = (SES.i / SES.items.length) * 100;
  let body = "";
  if (it.mode === "study") {
    body = `<div class="panel">${M(full(c))}</div><p class="note">${esc(c.h)}</p>
      <button class="btn primary big" data-act="studied">Fatto, l'ho letta</button>`;
  } else if (it.mode === "cloze" || it.mode === "quale") {
    const head = it.mode === "cloze" ? `<div class="panel">${M(clozeTex(c))}</div>` : "";
    const opts = it.opts.map((o, k) => `<button class="opt" data-act="opt" data-k="${k}"><span class="k">${k + 1}</span>${M(o.tex, true)}</button>`).join("");
    body = `${head}<div class="opts">${opts}</div><div id="fb"></div>`;
  } else {
    body = `<p class="hint">Scrivila su carta o dilla ad alta voce, poi controlla. Sii onesto: ti torna più avanti se non la sai.</p>
      <div id="fb"><button class="btn primary big" data-act="reveal">Mostra la formula</button></div>`;
  }
  app.innerHTML = `
  <div class="sesbar"><button class="link" data-act="quit">Esci</button>
    <div class="prog" aria-hidden="true"><i style="width:${pct}%"></i></div>
    <span class="count">${SES.i + 1}/${SES.items.length}</span></div>
  <div class="wavebox small"><canvas id="wave" aria-hidden="true"></canvas>
    <div class="wave-cap">combo ×${SES.combo} · modo n = ${Wave.n}</div></div>
  <article class="q">
    <div class="qhead"><span class="tag ${MODE_HL[it.mode]}">${MODE_LABEL[it.mode]}</span>
      <span class="qch">${c.c} · ${esc(CH[c.c - 1])}</span></div>
    <p class="prompt">${esc(it.mode === "cloze" ? c.n : c.q)}</p>
    ${body}
  </article>`;
  SES.state = "ask";
  Wave.attach(document.getElementById("wave"));
  Wave.set(0.15, Wave.n);
  mathAll(app);
}

function award(kind, res) {
  let gain = 0;
  if (res === "ok") {
    SES.combo++; SES.maxCombo = Math.max(SES.maxCombo, SES.combo);
    gain = (kind === "mem" ? 15 : 10) + 2 * Math.min(SES.combo - 1, 5);
    Wave.kick(SES.combo);
  } else if (res === "quasi") { gain = 5; }
  else { SES.combo = 0; Wave.damp(); }
  SES.xp += gain; S.xp += gain;
  return gain;
}
function afterAnswer(it, res, kind) {
  const c = BY_ID[it.id];
  SES.tot++;
  if (res === "ok") SES.ok++;
  grade(it.id, kind, res);
  const gain = award(kind, res);
  if (res === "no") {
    if (!SES.wrong.includes(it.id)) SES.wrong.push(it.id);
    if (!SES.requeued.has(it.id)) {
      SES.requeued.add(it.id);
      SES.items.push({ id: it.id, mode: it.mode === "memoria" ? "memoria" : "cloze" });
    }
  }
  save(); renderTop();
  const cap = app.querySelector(".wave-cap"); if (cap) cap.textContent = `combo ×${SES.combo} · modo n = ${Wave.n}`;
  return { c, gain };
}
function feedbackHtml(res, gain, c, showFormula) {
  const msg = res === "ok" ? `Giusto! +${gain} XP` : res === "quasi" ? `Quasi. +${gain} XP, torna domani` : "Non era questa. Te la ripropongo.";
  return `<div class="feedback ${res === "ok" ? "ok" : "no"}">
    <div class="verdict">${msg}</div>
    ${showFormula ? `<div class="panel">${M(full(c))}</div>` : ""}
    <p class="note">${esc(c.h)}</p>
    <button class="btn primary big" data-act="next" id="nextbtn">Avanti</button></div>`;
}
function answerOpt(k) {
  if (SES.state !== "ask") return;
  const it = SES.items[SES.i];
  const o = it.opts[k]; if (!o) return;
  SES.state = "done";
  const res = o.ok ? "ok" : "no";
  const { c, gain } = afterAnswer(it, res, "rec");
  app.querySelectorAll(".opt").forEach((b, i) => {
    b.disabled = true;
    if (it.opts[i].ok) b.classList.add("ok");
    else if (i === k) b.classList.add("no");
    else b.classList.add("dim");
  });
  const fb = document.getElementById("fb");
  fb.innerHTML = feedbackHtml(res, gain, c, it.mode === "cloze");
  mathAll(fb);
  const nb = document.getElementById("nextbtn"); nb.focus({ preventScroll: true });
  nb.scrollIntoView({ behavior: Wave.still ? "auto" : "smooth", block: "nearest" });
}
function reveal() {
  if (SES.state !== "ask") return;
  SES.state = "graded-wait";
  const c = BY_ID[SES.items[SES.i].id];
  const fb = document.getElementById("fb");
  fb.innerHTML = `<div class="panel">${M(full(c))}</div><p class="note">${esc(c.h)}</p>
    <div class="muted" style="font-size:.9rem">Com'è andata?</div>
    <div class="grades">
      <button class="btn g-no" data-act="mem" data-r="no">Non la sapevo</button>
      <button class="btn" data-act="mem" data-r="quasi">Quasi</button>
      <button class="btn g-ok" data-act="mem" data-r="ok">Giusta</button></div>`;
  mathAll(fb);
}
function gradeMem(r) {
  if (SES.state !== "graded-wait") return;
  SES.state = "done";
  const it = SES.items[SES.i];
  const { c, gain } = afterAnswer(it, r, "mem");
  const fb = document.getElementById("fb");
  fb.innerHTML = feedbackHtml(r, gain, c, true);
  mathAll(fb);
  document.getElementById("nextbtn").focus({ preventScroll: true });
}
function studied() {
  const it = SES.items[SES.i];
  grade(it.id, "study"); S.xp += 2; SES.xp += 2; save();
  next();
}
function next() {
  SES.i++;
  if (SES.i >= SES.items.length) go("results"); else { render(); window.scrollTo(0, 0); }
}

function reviewListHtml(ids) {
  return ids.map(id => { const c = BY_ID[id]; return `<article class="panel rv"><h3>${esc(c.n)}</h3>${M(full(c))}<p class="note">${esc(c.h)}</p></article>`; }).join("");
}
function renderResults() {
  const up = level() > SES.startLevel;
  app.innerHTML = `
  <section class="hero">
    <div class="eyebrow">${esc(SES.title)}</div>
    <h1>Sessione <span class="mark">finita</span></h1>
    ${up ? `<div class="levelup">Nuovo livello: ${esc(rankName(level()))}</div>` : ""}
    <div class="tiles">
      <div class="tile"><b>${SES.ok}/${SES.tot}</b><span>risposte giuste</span></div>
      <div class="tile"><b>+${SES.xp}</b><span>XP guadagnati</span></div>
      <div class="tile"><b>×${SES.maxCombo}</b><span>combo massima</span></div></div>
    <div class="row">
      <button class="btn primary" data-act="again">Un altro giro</button>
      <button class="btn" data-act="home">Torna all'albero</button></div>
  </section>
  ${SES.wrong.length ? `<section><h2>Da rivedere</h2><div class="review-list">${reviewListHtml(SES.wrong)}</div></section>` : `<section><p class="muted">Nessun errore in questa sessione.</p></section>`}`;
  mathAll(app);
}

/* ---------- lampo: giusta o sbagliata ---------- */
let L = null;
function startLampo() {
  const seen = CARDS.filter(c => isSeen(c.id));
  const pool = seen.length >= 12 ? seen : CARDS;
  L = { pool, end: Date.now() + 60000, score: 0, combo: 0, n: 0, ok: 0, mistakes: [], cur: null, timer: 0, last: null, startLevel: level() };
  go("lampo");
}
function nextLampo() {
  let c; do { c = pick(L.pool); } while (L.pool.length > 1 && L.last && c.id === L.last);
  L.last = c.id;
  const truth = Math.random() < 0.5;
  L.cur = { c, truth, tex: truth ? full(c) : fill(c, pick(c.d)) };
  const card = document.getElementById("swipe");
  card.classList.remove("ok", "no");
  card.style.transform = "";
  card.innerHTML = `<div class="qch">${esc(c.n)}</div>${M(L.cur.tex)}`;
  mathAll(card);
}
function renderLampo() {
  app.innerHTML = `
  <div class="sesbar"><button class="link" data-act="quit-lampo">Esci</button>
    <div class="timer" aria-hidden="true"><i id="tbar" style="width:100%"></i></div>
    <span class="score" id="lscore">0</span></div>
  <section style="margin-top:14px">
    <div class="muted" style="font-size:.9rem">Questa formula è giusta o sbagliata? Scorri a destra se è giusta, a sinistra se è sbagliata, o usa i pulsanti.</div>
    <article class="swipe" id="swipe"></article>
    <div class="vf"><button class="btn v-no" data-act="vf" data-v="0">← Sbagliata</button><button class="btn v-yes" data-act="vf" data-v="1">Giusta →</button></div>
    <div class="combo" id="lcombo">combo ×0</div>
    <div class="toast" id="ltoast" aria-live="polite"></div>
  </section>`;
  nextLampo();
  bindSwipe(document.getElementById("swipe"));
  clearInterval(L.timer);
  L.timer = setInterval(() => {
    const left = L.end - Date.now();
    const bar = document.getElementById("tbar");
    if (bar) bar.style.width = Math.max(0, left / 600) + "%";
    if (left <= 0) endLampo();
  }, 100);
}
function answerLampo(saysTrue) {
  if (!L || !L.cur || Date.now() > L.end) return;
  const right = saysTrue === L.cur.truth;
  const card = document.getElementById("swipe");
  L.n++;
  const toast = document.getElementById("ltoast");
  if (right) {
    L.ok++; L.combo++;
    const pts = 10 + 2 * Math.min(L.combo - 1, 10);
    L.score += pts;
    grade(L.cur.c.id, "lampo", "ok");
    card.classList.add("ok");
    toast.innerHTML = "";
  } else {
    L.combo = 0;
    grade(L.cur.c.id, "lampo", "no");
    L.mistakes.push({ id: L.cur.c.id, shown: L.cur.tex, truth: L.cur.truth });
    card.classList.add("no");
    toast.innerHTML = `<div class="t-head">${L.cur.truth ? "Era giusta." : "Era sbagliata. Quella giusta:"}</div>${L.cur.truth ? "" : M(full(L.cur.c))}`;
    mathAll(toast);
  }
  document.getElementById("lscore").textContent = L.score;
  document.getElementById("lcombo").textContent = `combo ×${L.combo}`;
  L.cur = null;
  setTimeout(() => { if (VIEW.name === "lampo" && Date.now() <= L.end) nextLampo(); }, right ? 260 : 650);
}
function endLampo() {
  if (!L) return;
  clearInterval(L.timer);
  const xp = Math.round(L.score / 5);
  S.xp += xp; L.xp = xp;
  L.record = L.score > S.best.lampo;
  if (L.record) S.best.lampo = L.score;
  if (L.n) touchStreak();
  save();
  go("lampo-end");
}
function renderLampoEnd() {
  const acc = L.n ? Math.round((L.ok / L.n) * 100) : 0;
  const up = level() > L.startLevel;
  const list = L.mistakes.map(m => {
    const c = BY_ID[m.id];
    return `<article class="panel rv"><h3>${esc(c.n)}</h3>
      <div class="muted" style="font-size:.85rem">${m.truth ? "Era giusta, l'hai scartata:" : "Era sbagliata. Quella giusta è:"}</div>${M(full(c))}<p class="note">${esc(c.h)}</p></article>`;
  }).join("");
  app.innerHTML = `
  <section class="hero">
    <div class="eyebrow">Lampo · 60 secondi</div>
    <h1>${L.record ? 'Nuovo <span class="mark">record!</span>' : 'Tempo <span class="mark">scaduto</span>'}</h1>
    ${up ? `<div class="levelup">Nuovo livello: ${esc(rankName(level()))}</div>` : ""}
    <div class="tiles">
      <div class="tile"><b>${L.score}</b><span>punti (record ${S.best.lampo})</span></div>
      <div class="tile"><b>${L.ok}/${L.n}</b><span>giuste (${acc}%)</span></div>
      <div class="tile"><b>+${L.xp}</b><span>XP</span></div></div>
    <div class="row"><button class="btn primary" data-act="lampo">Ancora</button><button class="btn" data-act="home">Torna all'albero</button></div>
  </section>
  ${list ? `<section><h2>Gli errori</h2><div class="review-list">${list}</div></section>` : ""}`;
  mathAll(app);
}
function bindSwipe(el) {
  let x0 = null, dx = 0, id = null;
  el.addEventListener("pointerdown", e => { if (!L || !L.cur) return; x0 = e.clientX; dx = 0; id = e.pointerId; try { el.setPointerCapture(id); } catch (_) {} });
  el.addEventListener("pointermove", e => {
    if (x0 === null || e.pointerId !== id) return;
    dx = e.clientX - x0;
    if (!Wave.still) el.style.transform = `translateX(${dx}px) rotate(${dx / 30}deg)`;
    el.classList.toggle("ok", dx > 60); el.classList.toggle("no", dx < -60);
  });
  const end = e => {
    if (x0 === null || (e && e.pointerId !== id)) return;
    x0 = null;
    if (Math.abs(dx) > 90) { answerLampo(dx > 0); }
    else { el.style.transform = ""; el.classList.remove("ok", "no"); }
    dx = 0;
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", () => { x0 = null; el.style.transform = ""; el.classList.remove("ok", "no"); });
}

/* ---------- eventi ---------- */
let resetArmed = false;
app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.getAttribute("data-act");
  if (a === "review") startReview();
  else if (a === "lampo") startLampo();
  else if (a === "free") startFree(b.getAttribute("data-mode"));
  else if (a === "filter") { VIEW.filter = +b.getAttribute("data-ch"); app.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", String(x === b))); }
  else if (a === "chapter") go("chapter", { ch: +b.getAttribute("data-ch") });
  else if (a === "train-ch") startChapter(VIEW.ch);
  else if (a === "home") go("home");
  else if (a === "quit") { SES = null; go("home"); }
  else if (a === "quit-lampo") { if (L) clearInterval(L.timer); L = null; go("home"); }
  else if (a === "opt") answerOpt(+b.getAttribute("data-k"));
  else if (a === "reveal") reveal();
  else if (a === "mem") gradeMem(b.getAttribute("data-r"));
  else if (a === "studied") studied();
  else if (a === "next") next();
  else if (a === "again") { const f = SES && SES.again; if (f) f(); else go("home"); }
  else if (a === "vf") answerLampo(b.getAttribute("data-v") === "1");
  else if (a === "reset") {
    if (!resetArmed) { resetArmed = true; b.textContent = "Tocca di nuovo per azzerare tutto"; setTimeout(() => { resetArmed = false; const r = document.getElementById("resetbtn"); if (r) r.textContent = "Azzera i progressi"; }, 4000); }
    else { resetArmed = false; S = blank(); save(); go("home"); }
  }
});
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (VIEW.name === "session" && SES) {
    const it = SES.items[SES.i];
    if (SES.state === "ask" && (it.mode === "cloze" || it.mode === "quale") && /^[1-4]$/.test(e.key)) { e.preventDefault(); answerOpt(+e.key - 1); }
    else if (SES.state === "ask" && it.mode === "memoria" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); reveal(); }
    else if (SES.state === "ask" && it.mode === "study" && e.key === "Enter") { e.preventDefault(); studied(); }
    else if (SES.state === "done" && e.key === "Enter" && document.activeElement && document.activeElement.id !== "nextbtn") { e.preventDefault(); next(); }
  } else if (VIEW.name === "lampo") {
    if (e.key === "ArrowRight") { e.preventDefault(); answerLampo(true); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); answerLampo(false); }
  }
});

function start() { render(); Sync.init(); }
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === "function") hot.ready(start); else start();
</script>
